name: Setup toolchain
description: Python 3.13, Node 22, and Pants with its local caches restored between runs.

inputs:
  deploy-tools:
    description: Also install what tools/deploy.py needs (npm ci for the CDK CLI, boto3).
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - uses: pantsbuild/actions/init-pants@v9
      with:
        gha-cache-key: pants-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pants.toml') }}
        named-caches-hash: ${{ hashFiles('3rdparty/python/default.lock') }}

    # No Pants *remote* cache here: the `experimental-github-actions-cache`
    # provider talks to GitHub's legacy cache API, which now answers every
    # request with HTTP 400 ("services aren't available"). Jobs still restore
    # Pants' local lmdb/named caches via init-pants above. See
    # docs/EXPERIMENTS.md #3 for the S3-backed bazel-remote alternative.
    - name: Configure Pants for CI
      shell: bash
      run: echo "PANTS_CONFIG_FILES=pants.ci.toml" >> "$GITHUB_ENV"

    - name: Install deploy tooling
      if: inputs.deploy-tools == 'true'
      shell: bash
      run: |
        npm ci
        python3 -m pip install "boto3>=1.40,<2"
