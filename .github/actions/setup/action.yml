name: Setup toolchain
description: Python 3.13, Node 22, Pants (with its local caches restored), and the GitHub Actions remote cache when the runner supports it.

inputs:
  deploy-tools:
    description: Also install what tools/deploy.py needs (npm ci for the CDK CLI, boto3).
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm

    - uses: pantsbuild/actions/init-pants@v9
      with:
        gha-cache-key: pants-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pants.toml') }}
        named-caches-hash: ${{ hashFiles('3rdparty/python/default.lock') }}

    # Pants' `experimental-github-actions-cache` provider speaks the legacy
    # Actions cache API (ACTIONS_CACHE_URL). Runners on GitHub's v2 cache
    # service don't expose that URL, and Pants refuses to start with an empty
    # remote store address, so only enable remote caching when it's present.
    # Without it, CI still gets the named/lmdb caches that init-pants saves.
    # ACTIONS_* values are only visible to JavaScript actions, hence github-script.
    - name: Configure Pants (remote cache when available)
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable('PANTS_CONFIG_FILES', 'pants.ci.toml');
          const url = process.env.ACTIONS_CACHE_URL;
          if (url) {
            core.exportVariable('PANTS_REMOTE_PROVIDER', 'experimental-github-actions-cache');
            core.exportVariable('PANTS_REMOTE_STORE_ADDRESS', url);
            core.exportVariable('PANTS_REMOTE_OAUTH_BEARER_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('PANTS_REMOTE_CACHE_READ', 'true');
            core.exportVariable('PANTS_REMOTE_CACHE_WRITE', 'true');
            core.info('Pants remote cache: GitHub Actions cache');
          } else {
            core.notice('ACTIONS_CACHE_URL not set (Actions cache v2): Pants remote cache disabled; using local caches only.');
          }

    - name: Install deploy tooling
      if: inputs.deploy-tools == 'true'
      shell: bash
      run: |
        npm ci
        python3 -m pip install "boto3>=1.40,<2"
