name: PR

on:
  pull_request:
  merge_group:

# A new push supersedes the running checks for the same PR. Merge-queue runs are never cancelled.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # What "changed" means: the PR's base branch, or the merge group's base commit.
  BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}

jobs:
  # Which apps does this change touch? Also drives the PR stage below.
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      count: ${{ steps.affected.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Affected apps
        id: affected
        run: |
          result="$(python3 tools/affected.py --since "$BASE_REF")"
          echo "$result"
          echo "apps=$(jq -c .apps <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq -r .count <<<"$result")" >> "$GITHUB_OUTPUT"

  # Fast feedback: lint, typecheck and unit tests for everything the change can break.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Deploy manifests match infra code
        run: python3 tools/deploy_plan.py --check
      # Equivalent to: pants --changed-since=$BASE_REF --changed-dependents=transitive lint check test ...
      # (or `::` when pants.toml, lockfiles or workflows changed).
      - name: Lint, typecheck, test (affected)
        run: tools/ci-pants.sh "$BASE_REF" --tag=-floci --tag=-e2e lint check test

  # Build artifacts and synthesize the affected CDK apps without deploying:
  # catches broken infra in ~1 minute, before the slower PR-stage deploy finishes.
  synth:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          deploy-tools: "true"
      - run: python3 tools/deploy.py --stage "pr-${{ github.event.number || 'mq' }}" --affected-since "$BASE_REF" --synth-only

  # Integration tests: a fresh Floci per job.
  floci-tests:
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        env:
          FLOCI_STORAGE_MODE: memory
          FLOCI_DEFAULT_REGION: eu-west-2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: tools/wait-for-floci.sh http://localhost:4566
      - name: Floci integration tests (affected)
        env:
          FLOCI_ENDPOINT: http://localhost:4566
        run: tools/ci-pants.sh "$BASE_REF" --tag=floci --tag=-e2e test

  # Deploy the affected apps (plus what they depend on) to a throwaway Floci and
  # run their end-to-end tests against it. The Floci container dies with the job,
  # so the stage name is only a label.
  pr-stage:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # Floci is started by a script, not as a service container: it needs a
    # user-defined Docker network shared with the containers it spawns
    # (ECR registry, Lambda, ECS). See tools/ci-start-floci.sh.
    env:
      STAGE: pr-${{ github.event.number || 'mq' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          deploy-tools: "true"
      - name: Start Floci
        run: tools/ci-start-floci.sh
      # Lambdas and the ECS task are ARM64 (what we'd run on real AWS); GitHub's
      # runners are x86, so Floci needs QEMU to run those containers.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Deploy affected apps and their dependencies
        run: |
          python3 tools/deploy.py \
            --stage "$STAGE" \
            --affected-since "$BASE_REF" \
            --with-deps \
            --endpoint http://localhost:4566 \
            --runtime-endpoint http://floci:4566
        # Lambda/ECS containers share Floci's network and reach it by name.
      - name: End-to-end tests for the affected apps
        env:
          AFFECTED_APPS: ${{ needs.plan.outputs.apps }}
          AWS_ENDPOINT_URL: http://localhost:4566
          FLOCI_ENDPOINT: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: eu-west-2
        run: |
          specs="$(jq -r '.[] | "apps/\(.)::"' <<<"$AFFECTED_APPS" | tr '\n' ' ')"
          pants --tag=e2e test $specs
      - name: Floci logs (on failure)
        if: failure()
        run: docker logs floci --tail 300 || true
