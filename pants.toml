[GLOBAL]
pants_version = "2.31.0"
backend_packages = [
  "pants.backend.python",
  "pants.backend.experimental.python.lint.ruff.check",
  "pants.backend.experimental.python.lint.ruff.format",
  "pants.backend.experimental.python.typecheck.pyright",
  "pants.backend.awslambda.python",
  "pants.backend.docker",
]
# Copier templates contain Jinja placeholders, not real Python/BUILD files.
pants_ignore.add = ["/templates/"]

[source]
# Each app has three roots: runtime code, CDK infra, tests.
# Infra and tests use app-prefixed packages (orders_infra, ...) so module
# names never collide across apps in one resolve.
root_patterns = [
  "/apps/*/src",
  "/apps/*/infra",
  "/apps/*/tests",
  "/libs/*/src",
  "/libs/*/tests",
  "/tools",
]

[python]
interpreter_constraints = ["==3.13.*"]
enable_resolves = true
default_resolve = "python-default"

[python.resolves]
python-default = "3rdparty/python/default.lock"

[python-infer]
# Fail loudly if an import can't be mapped to a target: keeps the
# dependency graph (and therefore "affected" detection) honest.
unowned_dependency_behavior = "error"

[pytest]
args = ["-q"]
execution_slot_var = "PANTS_EXECUTION_SLOT"

[test]
# Tags: "floci" = needs a running Floci, "e2e" = needs a deployed stage.
# These env vars let those tests reach it; plain unit tests ignore them.
extra_env_vars = [
  "AWS_ENDPOINT_URL",
  "FLOCI_ENDPOINT",
  "STAGE",
  "AWS_DEFAULT_REGION",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "PACT_UPDATE",
  "REPO_ROOT",
]

[ruff]
config = "ruff.toml"

[anonymous-telemetry]
enabled = false
