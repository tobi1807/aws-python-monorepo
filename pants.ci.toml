# Layered on top of pants.toml in CI: PANTS_CONFIG_FILES=pants.ci.toml.
# Remote caching is switched on by .github/actions/setup only when the runner
# exposes a cache endpoint Pants can use (see the comment there).
[GLOBAL]
colors = true

[stats]
# Prints cache hits/misses and time saved at the end of every run.
log = true
